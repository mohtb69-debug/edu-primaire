name: build-and-deploy
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths-ignore: ["data/**", "site/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Save collected items
        run: |
          date +%Y-%m > data/heartbeat.txt
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/items.json data/heartbeat.txt posts
          git diff --staged --quiet || (git commit -m "update items" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
